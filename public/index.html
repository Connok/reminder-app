<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Alert Scheduler</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>NudgeFlow 🔮</h1>
      <p>
        Configure a completely custom alert stream delivered at random
        intervals.
      </p>

      <form id="registrationForm">
        <input
          type="email"
          id="emailInput"
          placeholder="Enter subscriber email"
          required
        />

        <input
          type="text"
          id="messageInput"
          placeholder="What should the alert say?"
          required
        />

        <div class="time-row">
          <div class="input-group">
            <label class="field-label">Min (Minutes)</label>
            <input type="number" id="minTimeInput" value="1" min="1" required />
          </div>
          <div class="input-group">
            <label class="field-label">Max (Minutes)</label>
            <input type="number" id="maxTimeInput" value="3" min="1" required />
          </div>
        </div>

        <button type="submit">Activate Custom Stream</button>
      </form>

      <div id="statusMessage"></div>
      <div class="unsubscribe-box">
        <h2>Stop Alerts</h2>
        <form id="unsubscribeForm">
          <input
            type="email"
            id="unsubEmailInput"
            placeholder="Enter email to unsubscribe"
            required
          />
          <button type="submit" class="btn-secondary">Cancel My Stream</button>
        </form>
        <div id="unsubStatusMessage"></div>
      </div>
    </div>

    <script src="/js/app.js"></script>
  </body>
</html>
